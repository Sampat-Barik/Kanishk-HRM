name: Deploy HRM Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          HRM_API_BASE: ${{ vars.HRM_API_BASE }}
        run: |
          mkdir -p _site
          cp -r src/main/resources/static/hrm/* _site/
          printf 'window.HRM_API_BASE = %s;\n' "$(node -e 'console.log(JSON.stringify(process.env.HRM_API_BASE || ""))')" > _site/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
