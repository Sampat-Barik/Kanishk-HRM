# Production profile for Supabase PostgreSQL + Clerk authentication
spring:
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
hrm:
  clerk-issuer: ${CLERK_ISSUER:https://positive-caiman-7190.clerk.accounts.dev}
  clerk-secret-key: ${CLERK_SECRET_KEY:}
