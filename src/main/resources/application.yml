spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
hrm:
  zone: ${HRM_ZONE:Asia/Kolkata}
  daily-regular-hours: ${DAILY_REGULAR_HOURS:8}
  cors-origin: ${HRM_FRONTEND_ORIGIN:}
  clerk-issuer: ${CLERK_ISSUER:https://positive-caiman-7190.clerk.accounts.dev}
  clerk-secret-key: ${CLERK_SECRET_KEY:}
