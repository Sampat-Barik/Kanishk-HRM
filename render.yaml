services:
  - type: web
    name: kanishk-hrm-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: HRM_FRONTEND_ORIGIN
        value: https://sampat-barik.github.io,https://kanishkservices.com
      - key: HRM_ZONE
        value: Asia/Kolkata
      - key: DAILY_REGULAR_HOURS
        value: "8"
      - key: DB_POOL_SIZE
        value: "5"
      - key: CLERK_ISSUER
        value: https://positive-caiman-7190.clerk.accounts.dev
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
